services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: narrative_engine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/narrative_engine
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/narrative_engine_test
      NE_LLM_PROVIDER: ${NE_LLM_PROVIDER:-openai}
      NE_LLM_BASE_URL: ${NE_LLM_BASE_URL:-https://api.venice.ai/api/v1}
      NE_LLM_MODEL: ${NE_LLM_MODEL:-zai-org-glm-5-1}
      NE_LLM_REASONING_EFFORT: ${NE_LLM_REASONING_EFFORT:-none}
      NE_SEG_MODEL: ${NE_SEG_MODEL:-zai-org-glm-4.7-flash}
      NE_EXTRACT_MODEL: ${NE_EXTRACT_MODEL:-zai-org-glm-5-1}
      NE_CLASSIFY_MODEL: ${NE_CLASSIFY_MODEL:-deepseek-v3.2}
      NE_LINK_MODEL: ${NE_LINK_MODEL:-deepseek-v3.2}
      NE_LINK_NEIGHBOR_WINDOW: ${NE_LINK_NEIGHBOR_WINDOW:-1}
      NE_LINK_MAX_YEAR_GAP: ${NE_LINK_MAX_YEAR_GAP:-25}
      NE_LINK_MIN_LEXICAL_OVERLAP: ${NE_LINK_MIN_LEXICAL_OVERLAP:-0.2}
      NE_TAU_CLASS: ${NE_TAU_CLASS:-0.5}
      NE_TAU_ROLE: ${NE_TAU_ROLE:-0.5}
      NE_TAU_SCOPE: ${NE_TAU_SCOPE:-0.6}
      NE_LLM_API_KEY: ${NE_LLM_API_KEY:-}
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    depends_on:
      db:
        condition: service_healthy
    command: python -m pytest -v --tb=short

  # Always-on app (T7/T8): drop-directory watcher + dashboard on :8000.
  # NO AUTH -- localhost/dev binding assumption only.
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/narrative_engine
      NE_WATCH_DIR: /app/data/raw
      NE_LLM_PROVIDER: ${NE_LLM_PROVIDER:-openai}
      NE_LLM_BASE_URL: ${NE_LLM_BASE_URL:-https://api.venice.ai/api/v1}
      NE_LLM_MODEL: ${NE_LLM_MODEL:-zai-org-glm-5-1}
      NE_LLM_REASONING_EFFORT: ${NE_LLM_REASONING_EFFORT:-none}
      NE_SEG_MODEL: ${NE_SEG_MODEL:-zai-org-glm-4.7-flash}
      NE_EXTRACT_MODEL: ${NE_EXTRACT_MODEL:-zai-org-glm-5-1}
      NE_CLASSIFY_MODEL: ${NE_CLASSIFY_MODEL:-deepseek-v3.2}
      NE_LINK_MODEL: ${NE_LINK_MODEL:-deepseek-v3.2}
      NE_LINK_NEIGHBOR_WINDOW: ${NE_LINK_NEIGHBOR_WINDOW:-1}
      NE_LINK_MAX_YEAR_GAP: ${NE_LINK_MAX_YEAR_GAP:-25}
      NE_LINK_MIN_LEXICAL_OVERLAP: ${NE_LINK_MIN_LEXICAL_OVERLAP:-0.2}
      NE_TAU_CLASS: ${NE_TAU_CLASS:-0.5}
      NE_TAU_ROLE: ${NE_TAU_ROLE:-0.5}
      NE_TAU_SCOPE: ${NE_TAU_SCOPE:-0.6}
      NE_LLM_MAX_TOKENS: ${NE_LLM_MAX_TOKENS:-4000}
      NE_ENABLE_LINKING: ${NE_ENABLE_LINKING:-true}
      # Set NE_LLM_API_KEY (e.g. via .env) to enable
      # extraction; without a key files ingest with extraction pending.
      NE_LLM_API_KEY: ${NE_LLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./alembic:/app/alembic
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn narrative_engine.api.app:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
